server {
  listen 80;
  listen [::]:80;
  server_name 159.89.93.140;

  root /var/www/159.89.93.140/current;
  index index.html;

  access_log /var/log/nginx/ecochill.access.log;
  error_log /var/log/nginx/ecochill.error.log warn;

  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
